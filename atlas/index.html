(function () {
  'use strict';
  window.makeSky = function makeSky(canvas, { groups, items, cross = [], onPick, onManual }) {
    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) throw new Error('当前设备无法创建星图画布。');
    const PI2 = Math.PI * 2;
    const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const font = '"PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    const mono = '"SFMono-Regular",Consolas,monospace';
    const root = { id: 'codex', name: 'Codex', type: 'root', color: '#f4f4e9', x: 0, y: 2, z: 12 };
    const anchors = [
      [-139, 79, 38], [128, 88, -35], [-148, -92, -41], [130, -105, 44]
    ];
    let seed = 26981;
    const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    const rgb = color => {
      let value = String(color || '#e4b362').replace('#', '');
      if (value.length === 3) value = value.split('').map(c => c + c).join('');
      const n = parseInt(value, 16);
      return Number.isFinite(n) ? [n >> 16, (n >> 8) & 255, n & 255].join(',') : '226,178,98';
    };
    const rgba = (color, alpha) => 'rgba(' + color + ',' + clamp(alpha, 0, 1) + ')';
    const nodes = [root], byId = new Map([[root.id, root]]);
    const edges = [];
    groups.forEach((group, gi) => {
      const [x, y, z] = anchors[gi % anchors.length];
      const center = { ...group, x, y, z, type: 'group', index: gi };
      nodes.push(center); byId.set(center.id, center);
      edges.push({ source: root.id, target: center.id, type: 'trunk' });
      const members = items.filter(item => item.group === group.id);
      members.forEach((item, j) => {
        const angle = (j / members.length) * PI2 - 2.0 + gi * .64 + (random() - .5) * .24;
        const radius = 40 + random() * 25;
        const nx = x + Math.cos(angle) * radius;
        const ny = y + Math.sin(angle) * radius * .94;

    const band=button('','band',()=>jump(lookup.get(g.items[0].id).order));
    band.style.setProperty('--tone',g.color);
    band.innerHTML='<div class="band-cap"><span>'+g.name+'</span><em>0 / 5</em></div><div class="ticks">'+('<i class="tick"></i>'.repeat(5))+'</div>';
    band.title='跳至'+g.name; $('bands').append(band);bands.set(g.id,band);
    const sec=document.createElement('section');sec.className='grp';sec.style.setProperty('--tone',g.color);
    const head=button('','gbutton',()=>{expanded.has(g.id)?expanded.delete(g.id):expanded.add(g.id);updateIndex()});head.setAttribute('aria-controls','list-'+g.id);
    head.innerHTML='<i class="dot"></i>'+g.name+'<span class="num">0 / 5</span><span class="caret"></span>';
    const inner=document.createElement('div');inner.className='items';inner.id='list-'+g.id;
    for(const v of g.items){
      const i=lookup.get(v.id).order;
      const row=button('','row',()=>{jump(i);drawer(false)});
      row.innerHTML='<span class="seq">'+pad(i+1)+'</span><span>'+v.name+'</span><i class="state"></i>';
      rows.set(v.id,row);inner.append(row);
    }
    sec.append(head,inner);$('index').append(sec);sections.set(g.id,sec);
  }
  function updateIndex(){
    for(const g of GROUPS){
      const sec=sections.get(g.id),band=bands.get(g.id);
      const quantity=g.items.filter(v=>lookup.get(v.id).order<count).length;
      sec.classList.toggle('open',expanded.has(g.id));
      sec.querySelector('.gbutton').setAttribute('aria-expanded',String(expanded.has(g.id)));
      sec.querySelector('.num').textContent=band.querySelector('em').textContent=quantity+' / 5';
      [...band.querySelectorAll('.tick')].forEach((el,i)=>el.classList.toggle('lit',i<quantity));
      for(const v of g.items){
        const row=rows.get(v.id), sel=(focus===v.id||mode==='transition'&&items[cursor].id===v.id);
        row.classList.toggle('selected',sel);row.classList.toggle('seen',lookup.get(v.id).order<count);
        if(sel)row.setAttribute('aria-current','step');else row.removeAttribute('aria-current');
      }
    }
  }
  function sync(){
    const item=lookup.get(focus)||(mode==='transition'?items[cursor]:null);
    const group=groups.get(item?.group||focus);
    document.documentElement.style.setProperty('--focus',group?.color||'#f1ecdc');
    $('progress').textContent=pad(count);
    const stats=sky.getStats();
    $('nodes').textContent=pad(stats.nodes);$('links').textContent=pad(stats.links);
    $('cameraMode').textContent=({item:'节点近景',group:'分类星团',transition:'星团过渡',overview:'全局视野',manual:'自由视角'})[mode];
    $('status').textContent=running?'自动漫游 · '+pad(cursor+1)+' / 20':mode==='overview'&&count===20?'全图已点亮':'漫游已暂停';
    $('play').innerHTML=icon(running?'pause':'play')+(running?'暂停漫游':cursor===19&&count===20?'重新漫游':'继续漫游');
    $('prev').disabled=cursor===0;$('next').disabled=cursor===items.length-1;
    const root=focus==='codex', validItem=item&&!root;
    $('detailTag').textContent=validItem?group.name+'  /  '+pad(lookup.get(item.id).order+1)+' OF 20':root?'CODEX  /  ROOT':'GROUP  /  '+group.en;
    $('detailName').textContent=validItem?item.name:root?'Codex 工作全图':group.name;
    $('detailText').textContent=validItem?item.detail:root?'四个分类中心连接各自的工作。点击分类或节点，可以查看对应项目和跨组关系。':group.items.map(v=>v.short).join(' · ');
    const rels=$('relations');rels.replaceChildren();
    if(validItem) for(const edge of CROSS.filter(e=>e.source===item.id||e.target===item.id)){
      const other=lookup.get(edge.source===item.id?edge.target:edge.source);
      const b=button('↗ '+edge.label,'relation',()=>jump(other.order));
      b.title=edge.detail+' 点击查看'+other.name;b.setAttribute('aria-label',edge.label+'，查看'+other.name);rels.append(b);
    }
    updateIndex();
  }
  function render(animate=true){
    sky.setView({visible:items.slice(0,count).map(v=>v.id),focus,mode,animate});sync();
  }
  function clearTimer(){if(timer)clearTimeout(timer);timer=0}
  function arm(ms){clearTimer();remaining=ms;if(!running)return;endAt=performance.now()+ms;timer=setTimeout(tick,ms)}
  function pause(){
    if(running&&timer)remaining=Math.max(100,endAt-performance.now());
    running=false;clearTimer();sync();
  }
  function follow(i){
    const old=items[cursor]?.group;cursor=i;count=i+1;const item=items[i];
    expanded.clear();expanded.add(item.group);
    const cut=old!==item.group&&i>0;
    mode=cut?'transition':'item';focus=cut?item.group:item.id;
    render();arm(cut?3200:3000);
  }
  function tick(){
    timer=0;if(!running)return;
    if(mode==='transition'){mode='item';focus=items[cursor].id;render();arm(3000);return}
    if(cursor<items.length-1){follow(cursor+1);return}
    running=false;focus='codex';mode='overview';render();
  }
  function jump(i){
    if(i<0||i>=items.length)return;
    running=false;clearTimer();cursor=i;count=Math.max(count,i+1);remaining=3000;
    const item=items[i];expanded.add(item.group);focus=item.id;mode='item';render();
    const row=rows.get(item.id), nav=$('index'); if(nav.clientHeight && (row.offsetTop-nav.offsetTop<nav.scrollTop || row.offsetTop-nav.offsetTop+row.offsetHeight>nav.scrollTop+nav.clientHeight))nav.scrollTop=Math.max(0,row.offsetTop-nav.offsetTop-nav.clientHeight*.45);
  }
  function pick(id){
    if(lookup.has(id)){jump(lookup.get(id).order);return}
    if(id!=='codex'&&!groups.has(id))return;
    pause();mode=id==='codex'?'overview':'group';focus=id;
    if(groups.has(id))expanded.add(id);render();
  }
  function restart(){
    clearTimer();running=true;cursor=0;count=1;mode='item';focus='teams';
    expanded.clear();expanded.add('office');$('index').scrollTop=0;sky.reset();render(false);arm(4200);
  }
  function toggle(){
    if(running){pause();return}
    if(cursor===items.length-1&&mode!=='transition'){restart();return}
    running=true;
    if(mode!=='transition'){count=cursor+1;mode='item';focus=items[cursor].id;expanded.add(items[cursor].group);render()}
    else sync();arm(remaining||3000);
  }
  function drawer(open){
    document.body.classList.toggle('drawer-open',open);$('open').setAttribute('aria-expanded',String(open));
    if(open){pause();$('close').focus()}else if(matchMedia('(max-width:800px)').matches)$('open').focus();
  }
  $('all').onclick=()=>{clearTimer();running=false;cursor=19;count=20;focus='codex';mode='overview';sky.reset();render();drawer(false)};
  $('fit').onclick=()=>{pause();mode='overview';focus='codex';sky.reset();render()};
  $('minus').onclick=()=>{pause();mode='manual';sky.zoom(.8);sync()};
  $('plus').onclick=()=>{pause();mode='manual';sky.zoom(1.25);sync()};
  $('replay').onclick=restart;$('play').onclick=toggle;$('next').onclick=()=>jump(cursor+1);$('prev').onclick=()=>jump(cursor-1);
  $('open').onclick=()=>drawer(true);$('close').onclick=()=>drawer(false);$('shade').onclick=()=>drawer(false);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){drawer(false);return}
    if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button')||document.body.classList.contains('drawer-open'))return;
    if(e.key===' '){e.preventDefault();toggle()}
    if(e.key==='ArrowRight'){e.preventDefault();jump(cursor+1)}
    if(e.key==='ArrowLeft'){e.preventDefault();jump(cursor-1)}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause()});
  render(false);arm(4200);
})();

</script></body></html>
